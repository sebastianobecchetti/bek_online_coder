name: CI

# GitHub Pages for this repo is configured to serve straight from the main
# branch's root (not from an Actions-deployed artifact) -- there's no token
# available to change that setting via the API, so main.js/worker.js/vendor
# assets are committed directly instead of built by a deploy job. This
# workflow's only job is to make sure a broken build or a stale committed
# bundle can't reach main unnoticed: it builds and runs the two verification
# rings that don't need a sibling checkout or the C++ binaries (Ring 1's
# manifest check, Ring 3's bundle-reproducibility check). Ring 2 (the
# C++ bek_to_ply decode-diff) needs a local C++ build and a local tiny.ply, so
# it only ever runs locally via `npm run verify` -- skipped here explicitly,
# not silently.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run verify:vendor
      - run: npm run verify:bundle
      - run: |
          echo "SKIP: Ring 2 (bek_to_ply decode-diff) needs a local C++ build of github.com/sebastianobecchetti/bek; run 'npm run verify' locally for the full three-ring check."
